# =============================================================================
# log4j.properties for Apache Livy
# Placed at ${LIVY_HOME}/conf/log4j.properties inside the container.
#
# Without this file Livy prints:
#   log4j:WARN No appenders could be found for logger (...)
#   log4j:WARN Please initialize the log4j system properly.
# =============================================================================

# Root logger: INFO level, write to console only
log4j.rootLogger=INFO, console

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1} - %m%n

# Silence overly verbose libraries
log4j.logger.org.eclipse.jetty=WARN
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.apache.spark=WARN
log4j.logger.com.amazonaws=WARN

# Keep Livy's own loggers at INFO so job submission events are visible
log4j.logger.org.apache.livy=INFO
