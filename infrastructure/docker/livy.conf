# =============================================================================
# Apache Livy Server Configuration
# This file is placed at ${LIVY_HOME}/conf/livy.conf inside the container.
# =============================================================================

# -----------------------------------------------------------------------------
# Spark Cluster Connection
# Livy delegates all job execution to the Spark Standalone cluster.
# Client machines talk only to Livy (port 8998) and never directly to Spark.
# -----------------------------------------------------------------------------
livy.spark.master = spark://spark-master:7077
livy.spark.deploy-mode = client

# -----------------------------------------------------------------------------
# Livy Server Binding
# Listen on all interfaces so the port is reachable from outside the container.
# -----------------------------------------------------------------------------
livy.server.host = 0.0.0.0
livy.server.port = 8998

# -----------------------------------------------------------------------------
# Session management
# An idle interactive session is automatically expired after 1 hour.
# -----------------------------------------------------------------------------
livy.server.session.timeout = 1h
livy.server.session.max-creation = 100

# -----------------------------------------------------------------------------
# Security
# Authentication is disabled for local/development use.
# Do NOT set livy.server.auth.type here to leave it unset (no auth).
# Setting it to "None" is not valid -- Livy treats any value as a custom
# handler name and then requires livy.server.auth.<type>.class to be defined.
# To enable auth for production, set type to "kerberos" or "ldap" and
# configure the corresponding class and options.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Scala / Spark runtime version alignment
# Must match the Scala version used to build the Spark distribution.
# spark-3.5.1-bin-hadoop3 is compiled with Scala 2.12.
# -----------------------------------------------------------------------------
livy.spark.scala-version = 2.12

# -----------------------------------------------------------------------------
# Spark home path inside the container (used by Livy to locate spark-submit).
# This must match SPARK_HOME in the Dockerfile.
# -----------------------------------------------------------------------------
livy.server.spark-home = /opt/spark
