# =============================================================================
# SparkBridge - Docker Compose
#
# All four services use the same image: spark-bridge
# Built once from infrastructure/docker/Dockerfile (Spark 3.5.1 + Livy 0.7.1).
#
# Service topology:
#
#   spark-master          Runs the Spark Master daemon.
#   livy                  Runs the Apache Livy REST server.
#                         This is the ONLY service clients need to reach.
#   spark-worker-1/2      Spark Workers that register to spark-master.
#
# Client machines speak only to the livy service on port 8998.
# No Spark or Java installation is required on any client machine.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Spark Master
  # Manages the cluster and accepts worker registrations on port 7077.
  # Web UI is available at http://localhost:8080 for monitoring.
  # ---------------------------------------------------------------------------
  spark-master:
    image: spark-bridge          # tag the built image; other services reuse it
    container_name: spark-master
    hostname: spark-master
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Spark Master Web UI (operators / monitoring)
      - "7077:7077"   # Spark Master RPC (workers + Livy connect here)
    networks:
      spark-net:
        ipv4_address: 172.28.0.2

  # ---------------------------------------------------------------------------
  # Apache Livy - REST Gateway
  # Accepts job submissions from clients via HTTP on port 8998.
  # Internally dispatches those jobs to the Spark Master on port 7077.
  # Clients NEVER need to know about Spark, Java, or spark-submit.
  # ---------------------------------------------------------------------------
  livy:
    image: spark-bridge          # same image -- Livy and Spark binaries co-located
    container_name: livy
    hostname: livy
    # Wait for spark-master to become ready before starting Livy.
    command: bash -c "sleep 15 && /opt/livy/bin/livy-server"
    depends_on:
      - spark-master
    ports:
      - "8998:8998"   # Livy REST API  <-- the only port clients need
      - "4040:4040"   # Spark Application Web UI (active job debugging)
    volumes:
      - ../src/jobs:/opt/spark-jobs   # Job scripts submitted via local:// paths
    environment:
      - SPARK_HOME=/opt/spark
      - LIVY_HOME=/opt/livy
      - PYSPARK_PYTHON=python3
    networks:
      - spark-net

  # ---------------------------------------------------------------------------
  # Spark Worker 1
  # ---------------------------------------------------------------------------
  spark-worker-1:
    image: spark-bridge          # same image
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://172.28.0.2:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER_URL=spark://172.28.0.2:7077
    volumes:
      - ../src/jobs:/opt/spark-jobs   # Job files must be on the executor nodes too
    networks:
      - spark-net

  # ---------------------------------------------------------------------------
  # Spark Worker 2
  # ---------------------------------------------------------------------------
  spark-worker-2:
    image: spark-bridge          # same image
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://172.28.0.2:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER_URL=spark://172.28.0.2:7077
    volumes:
      - ../src/jobs:/opt/spark-jobs
    networks:
      - spark-net

# =============================================================================
# Network
# A dedicated bridge network with a fixed subnet so worker-to-master
# registration uses a stable IP address.
# =============================================================================
networks:
  spark-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
