# =============================================================================
# SparkBridge - Docker Compose
#
# Services:
#   spark-master  - Spark Master daemon + Apache Livy REST gateway
#                   Clients interact ONLY with this service on port 8998.
#   spark-worker-1 / spark-worker-2  - Spark Workers
#
# The PySpark job scripts (src/jobs/) are mounted into every container at
# /opt/spark-jobs so Livy can reference them via local:// paths.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Spark Master + Apache Livy
  # This is the only service that client machines need to reach.
  # ---------------------------------------------------------------------------
  spark-master:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: spark-bridge-master:3.5.1
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_HOME=/opt/bitnami/spark
      - LIVY_HOME=/opt/livy
      - JAVA_HOME=/opt/bitnami/java
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC (internal cluster use)
      - "8998:8998"   # Livy REST API  <- the only port clients need
      - "4040:4040"   # Spark Application Web UI (active job monitoring)
    volumes:
      - ../src/jobs:/opt/spark-jobs   # PySpark job scripts accessible to Livy
    networks:
      spark-net:
        ipv4_address: 172.28.0.2

  # ---------------------------------------------------------------------------
  # Spark Worker 1
  # ---------------------------------------------------------------------------
  spark-worker-1:
    image: bitnami/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://172.28.0.2:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER_URL=spark://172.28.0.2:7077
    volumes:
      - ../src/jobs:/opt/spark-jobs   # Workers need the same job files for local:// paths
    networks:
      - spark-net

  # ---------------------------------------------------------------------------
  # Spark Worker 2
  # ---------------------------------------------------------------------------
  spark-worker-2:
    image: bitnami/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://172.28.0.2:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_MASTER_URL=spark://172.28.0.2:7077
    volumes:
      - ../src/jobs:/opt/spark-jobs
    networks:
      - spark-net

# =============================================================================
# Network configuration
# A dedicated bridge network with static IPs so worker registration is stable.
# =============================================================================
networks:
  spark-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
