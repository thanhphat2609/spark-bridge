name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Compile runner and jobs
        run: python -m compileall -q src
      - name: Unit tests
        run: pytest -q
      - name: Shell syntax
        run: for f in scripts/*.sh infrastructure/common/entrypoint.sh; do bash -n "$f"; done
      - name: Compose files are valid
        run: |
          cp infrastructure/azure/.env.example infrastructure/azure/.env
          docker compose -f infrastructure/azure/compose.master.yml config -q
          docker compose -f infrastructure/azure/compose.worker.yml config -q
          docker compose -f infrastructure/codespaces/docker-compose.yml config -q

  docker:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [azure, codespaces]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: infrastructure
          file: infrastructure/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy to Azure
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-azure.yml
    secrets: inherit
